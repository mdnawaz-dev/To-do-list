<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="style.css"/>

</head>

<body>
    <div class="container">
        <div class="To-Do-List App">
        <h1>To-Do List </h1>
        <div class="motivation-section">
            <p id="motivational-quote">Start your day with a task!</p>
        </div>
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p class="progress-text" id="progress-text">0/0 tasks completed</p>
        </div>
        <form class="input-form">
            <input type="text" id="task-input" placeholder="Add a new task..." required/>  

           <button type="submit" id="add-task-btn"><i class="fa-solid fa-plus fa-beat-fade"></i></button>
        </form>
        <div class="Tasks-Container">
                <ul id="task-list">
                    
                     
                </ul>
        </div>
     </div>
    </div>

    
</body>
<script src="app.js"></script>
</html>
